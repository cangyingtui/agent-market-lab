services:
  mysql:
    image: mysql:8.0
    container_name: agentsim-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "simulation_db"
      MYSQL_USER: "simulation_user"
      MYSQL_PASSWORD: "Sim2025!"
      TZ: "Asia/Shanghai"
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: agentsim-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "123456", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
