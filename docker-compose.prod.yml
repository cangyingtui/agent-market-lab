x-backend-env: &backend-env
  environment:
    APP_NAME: ${APP_NAME}
    APP_ENV: ${APP_ENV}
    APP_HOST: ${APP_HOST}
    APP_PORT: ${APP_PORT}
    ENABLE_DEBUG_API: ${ENABLE_DEBUG_API}
    DATABASE_URL: ${DATABASE_URL}
    DB_POOL_PRE_PING: ${DB_POOL_PRE_PING}
    DB_ECHO: ${DB_ECHO}
    REDIS_URL: ${REDIS_URL}
    REDIS_TASK_QUEUE: ${REDIS_TASK_QUEUE}
    REDIS_PRO_QUEUE: ${REDIS_PRO_QUEUE}
    REDIS_BASIC_QUEUE: ${REDIS_BASIC_QUEUE}
    REDIS_EXPORT_QUEUE: ${REDIS_EXPORT_QUEUE:-simulation:queue:exports}
    REDIS_PROGRESS_EXPIRE_SECONDS: ${REDIS_PROGRESS_EXPIRE_SECONDS}
    REDIS_HEARTBEAT_TTL_SECONDS: ${REDIS_HEARTBEAT_TTL_SECONDS}
    HEAVY_RESOURCE_LOCK_TTL_SECONDS: ${HEAVY_RESOURCE_LOCK_TTL_SECONDS:-7200}
    PDF_EXPORT_LOCK_TTL_SECONDS: ${PDF_EXPORT_LOCK_TTL_SECONDS:-900}
    JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    JWT_ALGORITHM: ${JWT_ALGORITHM}
    ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
    LLM_PROVIDER: ${LLM_PROVIDER}
    LLM_API_KEY: ${LLM_API_KEY}
    LLM_API_BASE: ${LLM_API_BASE}
    LLM_MODEL: ${LLM_MODEL}
    LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS}
    LLM_MAX_RETRY: ${LLM_MAX_RETRY}
    ENABLE_RAG: ${ENABLE_RAG}
    RAG_MODE: ${RAG_MODE}
    RAG_TOP_K: ${RAG_TOP_K}
    FAISS_INDEX_PATH: ${FAISS_INDEX_PATH}
    FAISS_METADATA_PATH: ${FAISS_METADATA_PATH}
    EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER}
    EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
    EMBEDDING_API_BASE: ${EMBEDDING_API_BASE}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL}
    EMBEDDING_DIM: ${EMBEDDING_DIM}
    EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS}
    EMBEDDING_USE_DIMENSIONS_PARAM: ${EMBEDDING_USE_DIMENSIONS_PARAM}
    ENABLE_DATA_ENRICHMENT: ${ENABLE_DATA_ENRICHMENT}
    ENRICHMENT_PROVIDER: ${ENRICHMENT_PROVIDER}
    ENRICHMENT_API_KEY: ${ENRICHMENT_API_KEY}
    ENRICHMENT_API_BASE: ${ENRICHMENT_API_BASE}
    ENRICHMENT_CACHE_TTL_HOURS: ${ENRICHMENT_CACHE_TTL_HOURS}
    ENRICHMENT_MAX_ITEMS_PER_RUN: ${ENRICHMENT_MAX_ITEMS_PER_RUN}
    ENABLE_DISTILL_CHECK: ${ENABLE_DISTILL_CHECK}
    DISTILL_MODEL_PATH: ${DISTILL_MODEL_PATH}
    DISTILL_API_BASE: ${DISTILL_API_BASE}
    DISTILL_API_KEY: ${DISTILL_API_KEY}
    DISTILL_TIMEOUT_SECONDS: ${DISTILL_TIMEOUT_SECONDS}
    DISTILL_BATCH_SIZE: ${DISTILL_BATCH_SIZE}
    DISTILL_CONSISTENCY_PATH: ${DISTILL_CONSISTENCY_PATH}
    DISTILL_MODEL_VERSION: ${DISTILL_MODEL_VERSION}
    STUDENT_BASE_MODEL: ${STUDENT_BASE_MODEL}
    DISTILL_MODEL_DIR: ${DISTILL_MODEL_DIR}
    SOCIAL_NETWORK_ENABLED: ${SOCIAL_NETWORK_ENABLED:-true}
    SOCIAL_NETWORK_K: ${SOCIAL_NETWORK_K:-4}
    SOCIAL_NETWORK_REWIRE_PROBABILITY: ${SOCIAL_NETWORK_REWIRE_PROBABILITY:-0.3}
    SOCIAL_NETWORK_MAX_ROUNDS: ${SOCIAL_NETWORK_MAX_ROUNDS:-3}
    SOCIAL_NETWORK_CONVERGENCE_THRESHOLD: ${SOCIAL_NETWORK_CONVERGENCE_THRESHOLD:-0.02}
    SOCIAL_TRUST_SENSITIVITY_MIN: ${SOCIAL_TRUST_SENSITIVITY_MIN:-0.5}
    SOCIAL_TRUST_SENSITIVITY_MAX: ${SOCIAL_TRUST_SENSITIVITY_MAX:-1.0}
    SOCIAL_REPRESENTATIVE_RATIO: ${SOCIAL_REPRESENTATIVE_RATIO:-0.03}
    SOCIAL_REPRESENTATIVE_MIN: ${SOCIAL_REPRESENTATIVE_MIN:-60}
    SOCIAL_REPRESENTATIVE_MAX: ${SOCIAL_REPRESENTATIVE_MAX:-300}
    SOCIAL_LLM_SAMPLE_SIZE: ${SOCIAL_LLM_SAMPLE_SIZE:-12}
    TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS}
    MAX_RETRY_TIMES: ${MAX_RETRY_TIMES}
    HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS}
    BASIC_REPORT_MIN_SECONDS: ${BASIC_REPORT_MIN_SECONDS}
    BASIC_REPORT_MAX_SECONDS: ${BASIC_REPORT_MAX_SECONDS}
    PRO_REPORT_MIN_SECONDS: ${PRO_REPORT_MIN_SECONDS}
    PRO_REPORT_MAX_SECONDS: ${PRO_REPORT_MAX_SECONDS}
    BASIC_TASK_ESTIMATE_SECONDS: ${BASIC_TASK_ESTIMATE_SECONDS:-1200}
    PRO_TASK_ESTIMATE_SECONDS: ${PRO_TASK_ESTIMATE_SECONDS:-2100}
    SHARE_TOKEN_SALT: ${SHARE_TOKEN_SALT}
    EXPORT_DIR: ${EXPORT_DIR}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
    PYTHONPATH: /app
    PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

services:
  mysql:
    image: mysql:8.0
    container_name: agentsim-prod-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7
    container_name: agentsim-prod-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    <<: *backend-env
    image: agentsim-backend:prod
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agentsim-prod-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - exports_data:/app/logs/exports
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    <<: *backend-env
    image: agentsim-backend:prod
    container_name: agentsim-prod-worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - exports_data:/app/logs/exports
    command: ["python", "engine/worker.py"]

  monitor:
    <<: *backend-env
    image: agentsim-backend:prod
    container_name: agentsim-prod-monitor
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "engine/monitor.py"]

  export-worker:
    <<: *backend-env
    image: agentsim-backend:prod
    container_name: agentsim-prod-export-worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - exports_data:/app/logs/exports
    command: ["python", "engine/export_worker.py"]

  frontend:
    image: agentsim-frontend:prod
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
    container_name: agentsim-prod-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  mysql_data:
  redis_data:
  exports_data:
